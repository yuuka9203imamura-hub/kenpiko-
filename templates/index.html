<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#79bdf3">
  <title>けんぴこ！</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <section id="titleScreen" class="screen title-screen">
      <div class="title-cloud cloud-a"></div>
      <div class="title-cloud cloud-b"></div>

      <div class="hero">
        <div class="hero-house" aria-hidden="true">
          <div class="chimney"></div>
          <div class="roof"></div>
          <div class="house-body">
            <div class="window"><span></span><span></span><span></span><span></span></div>
            <div class="door"></div>
          </div>
          <div class="bush bush-a"></div>
          <div class="bush bush-b"></div>
          <div class="flower flower-a">✿</div>
          <div class="flower flower-b">✿</div>
        </div>

        <div class="title-character">
        <img src="{{ url_for('static', filename='character-smile.png') }}" alt="けんぴこ！キャラクター" class="title-character-image">
      </div>
    </div>

    <h1 class="logo">けんぴこ！</h1>

      <button id="startButton" class="big-button start-button" type="button">
        <span class="play-triangle">▶</span> スタート
      </button>

      <button id="titleHighScoreButton" class="score-button" type="button">
        <span class="crown">♛</span>
        <span>ハイスコア</span>
        <strong id="titleHighScore">0点</strong>
      </button>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="hud">
        <div class="hud-box">
          <small>スコア</small>
          <strong id="score">0</strong>
        </div>
        <div class="hud-box timer-box">
          <small>⏱ 残り時間</small>
          <strong id="timer">15.0</strong>
        </div>
        <div class="hud-box combo-box">
          <small>コンボ</small>
          <strong id="combo">0</strong>
        </div>
      </header>

      <div id="field" class="field" aria-label="ゲームフィールド">
        <!-- 家はJavaScriptで生成 -->
      </div>

      <div id="comboPopup" class="combo-popup hidden">COMBO!</div>
      <div id="hitPopup" class="hit-popup hidden">HIT!</div>
      <div id="missPopup" class="miss-popup hidden">MISS</div>

      <div id="hammer" class="hammer hidden" aria-hidden="true">
        <div class="hammer-head"><span></span></div>
        <div class="hammer-handle"></div>
      </div>
    </section>

    <section id="gameOverScreen" class="screen gameover-screen hidden">
      <div class="gameover-cloud"></div>
      <div class="gameover-card">
        <div class="gameover-title">TIME UP!</div>
        <div class="score-label">あなたのスコアは</div>
        <div id="finalScore" class="final-score">0点</div>
        <div id="newRecord" class="new-record hidden">♛ NEW RECORD!</div>
        <div class="best-score">ハイスコア <strong id="bestScore">0</strong>点</div>

        <button id="retryButton" class="big-button retry-button" type="button">もう1回遊ぶ</button>
        <button id="backButton" class="back-button" type="button">タイトルへ戻る</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
